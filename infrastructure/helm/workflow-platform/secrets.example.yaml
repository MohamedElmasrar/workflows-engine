# DOCUMENTATION ONLY: shape of the Secrets the chart references. Excluded from the chart package (.helmignore).
# Do not commit real values. Create the Secrets with kubectl (see docs/runbooks/kubernetes.md) or, in production,
# sync them from a secret store (External Secrets Operator, Vault, Sealed Secrets, cloud CSI driver).
#
#   kubectl -n workflow-platform create secret generic workflow-platform-db \
#     --from-literal=workflow-password='...' \
#     --from-literal=execution-password='...' \
#     --from-literal=trigger-password='...'
#   kubectl -n workflow-platform create secret generic workflow-platform-trigger \
#     --from-literal=encryption-key="$(openssl rand -base64 32)"
---
apiVersion: v1
kind: Secret
metadata:
  name: workflow-platform-db
type: Opaque
stringData:
  workflow-password: "<password of the 'workflow' DB role>"        # workflow-service DB_PASSWORD
  execution-password: "<password of the 'execution' DB role>"      # execution-engine DB_PASSWORD
  trigger-password: "<password of the 'trigger_svc' DB role>"      # trigger-service DB_PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: workflow-platform-trigger
type: Opaque
stringData:
  # base64 of 32 random bytes (AES-256): openssl rand -base64 32
  # Encrypts webhook signing secrets at rest. Changing it makes existing webhook secrets undecryptable (rotate them).
  encryption-key: "<base64-32-bytes>"
