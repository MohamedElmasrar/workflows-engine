server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://localhost:8180/realms/workflow-platform}
          jwk-set-uri: ${OIDC_JWKS_URI:http://localhost:8180/realms/workflow-platform/protocol/openid-connect/certs}
          audiences: workflow-api
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
            - name: RequestSize
              args:
                maxSize: 1MB
          routes:
            # order matters: the more specific workflow sub-resources owned by other services come first
            - id: manual-executions
              uri: ${EXECUTION_ENGINE_URL:http://localhost:8082}
              order: 0
              predicates:
                - Path=/api/v1/workflows/{id}/executions/**,/api/v1/workflows/{id}/executions
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@principalOrIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${EXECUTION_START_RATE:5}
                    redis-rate-limiter.burstCapacity: ${EXECUTION_START_BURST:20}
            - id: workflow-triggers
              uri: ${TRIGGER_SERVICE_URL:http://localhost:8084}
              order: 0
              predicates:
                - Path=/api/v1/workflows/{id}/triggers/**,/api/v1/workflows/{id}/triggers,/api/v1/workflows/{id}/trigger-deliveries
            - id: webhooks
              uri: ${TRIGGER_SERVICE_URL:http://localhost:8084}
              order: 0
              predicates:
                - Path=/api/v1/webhooks/**
              filters:
                - name: RequestSize
                  args:
                    maxSize: 256KB
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 50
            - id: executions
              uri: ${EXECUTION_ENGINE_URL:http://localhost:8082}
              order: 1
              predicates:
                - Path=/api/v1/executions/**,/api/v1/executions
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@principalOrIpKeyResolver}"
                    redis-rate-limiter.replenishRate: 50
                    redis-rate-limiter.burstCapacity: 100
            - id: workflows
              uri: ${WORKFLOW_SERVICE_URL:http://localhost:8081}
              order: 2
              predicates:
                - Path=/api/v1/workflows/**,/api/v1/workflows,/api/v1/me
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@principalOrIpKeyResolver}"
                    redis-rate-limiter.replenishRate: 50
                    redis-rate-limiter.burstCapacity: 100

gateway:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        spring.kafka.listener: true

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
