global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: workflow-platform
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:8080
          - workflow-service:8081
          - execution-engine:8082
          - worker-service:8083
          - trigger-service:8084
