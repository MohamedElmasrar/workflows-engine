apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "wp.fullname" . }}-config
  labels:
    {{- include "wp.labels" . | nindent 4 }}
data:
  {{- $urls := dict
        "WORKFLOW_SERVICE_URL" (printf "http://%s:%v" (include "wp.componentName" (dict "root" $ "name" "workflow-service")) (index .Values.components "workflow-service" "port"))
        "EXECUTION_ENGINE_URL" (printf "http://%s:%v" (include "wp.componentName" (dict "root" $ "name" "execution-engine")) (index .Values.components "execution-engine" "port"))
        "TRIGGER_SERVICE_URL" (printf "http://%s:%v" (include "wp.componentName" (dict "root" $ "name" "trigger-service")) (index .Values.components "trigger-service" "port")) }}
  {{- $all := merge (deepCopy (.Values.config | default dict)) $urls }}
  {{- range $key, $value := $all }}
  {{ $key }}: {{ tpl (toString $value) $ | quote }}
  {{- end }}
