# Local development environment.
#   docker compose up -d --build                         # platform + infrastructure
#   docker compose --profile observability up -d         # + Jaeger, Prometheus, Grafana
# See README.md for ports and demo users.
name: workflow-platform

x-service-env: &service-env
  KAFKA_BOOTSTRAP: kafka:9092
  OIDC_ISSUER: http://localhost:8180/realms/workflow-platform
  OIDC_JWKS_URI: http://keycloak:8080/realms/workflow-platform/protocol/openid-connect/certs
  OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
  PLATFORM_MESSAGING_PARTITIONS: "6"
  LOG_FORMAT: ecs

x-service: &service
  restart: unless-stopped
  mem_limit: 768m
  depends_on: &service-deps
    postgres: { condition: service_healthy }
    kafka: { condition: service_healthy }
    keycloak: { condition: service_healthy }

services:
  # ------------------------------------------------------------------ infrastructure
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.1.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports: ["9094:9094"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      # Fixed issuer for tokens obtained by the browser; services reach Keycloak over the internal network.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./infrastructure/keycloak/workflow-platform-realm.json:/opt/keycloak/data/import/workflow-platform-realm.json:ro
    ports: ["8180:8080"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["8025:8025", "1025:1025"]

  mock-api:
    image: wiremock/wiremock:3.13.1
    command: ["--global-response-templating", "--disable-banner"]
    volumes:
      - ./infrastructure/docker/mock-api/mappings:/home/wiremock/mappings:ro
    ports: ["8089:8080"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.139.0
    command: ["--config=/etc/otel/collector.yaml"]
    volumes:
      - ./infrastructure/observability/otel/collector.yaml:/etc/otel/collector.yaml:ro

  # ------------------------------------------------------------------ platform services
  workflow-service:
    <<: *service
    build: { context: ., dockerfile: infrastructure/docker/service.Dockerfile, args: { MODULE: services/workflow-service, PORT: "8081" } }
    image: workflow-platform/workflow-service:dev
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/workflow
      DB_USER: workflow
      DB_PASSWORD: workflow
    ports: ["8081:8081"]

  execution-engine:
    <<: *service
    build: { context: ., dockerfile: infrastructure/docker/service.Dockerfile, args: { MODULE: services/execution-engine, PORT: "8082" } }
    image: workflow-platform/execution-engine:dev
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/execution
      DB_USER: execution
      DB_PASSWORD: execution
      ENGINE_LEASE_GRACE: ${ENGINE_LEASE_GRACE:-60s}
    ports: ["8082:8082"]

  worker-service:
    <<: *service
    build: { context: ., dockerfile: infrastructure/docker/service.Dockerfile, args: { MODULE: services/worker-service, PORT: "8083" } }
    image: workflow-platform/worker-service:dev
    environment:
      <<: *service-env
      REDIS_HOST: redis
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      # The mock API lives on the private compose network; an administrator explicitly trusts it.
      WORKER_HTTP_ALLOWED_HOSTS: mock-api
    depends_on:
      <<: *service-deps
      redis: { condition: service_healthy }
    ports: ["8083:8083"]

  trigger-service:
    <<: *service
    build: { context: ., dockerfile: infrastructure/docker/service.Dockerfile, args: { MODULE: services/trigger-service, PORT: "8084" } }
    image: workflow-platform/trigger-service:dev
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/trigger
      DB_USER: trigger_svc
      DB_PASSWORD: trigger
      # Development-only key. Generate a real one with: openssl rand -base64 32
      TRIGGER_ENCRYPTION_KEY: ${TRIGGER_ENCRYPTION_KEY:-ZGV2ZWxvcG1lbnQta2V5LW5vdC1mb3ItcHJvZC11c2U=}
      PUBLIC_BASE_URL: http://localhost:8080
    ports: ["8084:8084"]

  api-gateway:
    <<: *service
    build: { context: ., dockerfile: infrastructure/docker/service.Dockerfile, args: { MODULE: services/api-gateway, PORT: "8080" } }
    image: workflow-platform/api-gateway:dev
    environment:
      <<: *service-env
      REDIS_HOST: redis
      WORKFLOW_SERVICE_URL: http://workflow-service:8081
      EXECUTION_ENGINE_URL: http://execution-engine:8082
      TRIGGER_SERVICE_URL: http://trigger-service:8084
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      keycloak: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["8080:8080"]

  # ------------------------------------------------------------------ optional observability (profile)
  jaeger:
    image: jaegertracing/jaeger:2.11.0
    profiles: ["observability"]
    ports: ["16686:16686"]

  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    volumes:
      - ./infrastructure/observability/prometheus:/etc/prometheus:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:latest
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]

volumes:
  postgres-data:
  kafka-data:
