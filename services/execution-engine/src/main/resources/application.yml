server:
  port: ${PORT:8082}
  shutdown: graceful

spring:
  application:
    name: execution-engine
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/execution}
    username: ${DB_USER:execution}
    password: ${DB_PASSWORD:execution}
    hikari:
      maximum-pool-size: 20
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: execution-engine
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max.poll.interval.ms: 300000
    listener:
      ack-mode: record
      observation-enabled: true
      concurrency: 3
    template:
      observation-enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://localhost:8180/realms/workflow-platform}
          jwk-set-uri: ${OIDC_JWKS_URI:http://localhost:8180/realms/workflow-platform/protocol/openid-connect/certs}
          audiences: workflow-api

platform:
  web:
    max-request-bytes: 524288

engine:
  lease-grace: ${ENGINE_LEASE_GRACE:60s}
  sweeper:
    interval: 1s
  sse:
    poll-interval: 500ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
  level:
    org.apache.kafka: WARN

springdoc:
  api-docs:
    path: /v3/api-docs
