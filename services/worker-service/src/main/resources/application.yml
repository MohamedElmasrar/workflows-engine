server:
  port: ${PORT:8083}
  shutdown: graceful

spring:
  application:
    name: worker-service
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    consumer:
      group-id: worker-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      max-poll-records: 1
      properties:
        # longer than the maximum node timeout (300 s), so a slow task does not trigger a rebalance
        max.poll.interval.ms: 420000
    listener:
      ack-mode: record
      observation-enabled: true
    template:
      observation-enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000

worker:
  concurrency: ${WORKER_CONCURRENCY:3}
  attempt-cache-ttl: 24h
  http:
    # Administrator-trusted hosts that may resolve to private addresses (comma separated). Never from workflow input.
    allowed-hosts: ${WORKER_HTTP_ALLOWED_HOSTS:}
    max-response-bytes: 1048576
    connect-timeout: 5s
  mail:
    from: ${MAIL_FROM:workflows@example.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        spring.kafka.listener: true

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
  level:
    org.apache.kafka: WARN
