{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "wp.fullname" . }}
  labels:
    {{- include "wp.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    {{- if .Values.ingress.host }}
    - host: {{ .Values.ingress.host | quote }}
      http:
    {{- else }}
    - http:
    {{- end }}
        paths:
          {{- range .Values.ingress.paths }}
          {{- $target := index $.Values.components .component | default dict }}
          {{- if not $target.enabled }}
          {{- fail (printf "ingress path %s targets disabled or unknown component %s" .path .component) }}
          {{- end }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "wp.componentName" (dict "root" $ "name" .component) }}
                port:
                  name: http
          {{- end }}
{{- end }}
